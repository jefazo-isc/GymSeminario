<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>GROM 21</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="color-scheme" content="light dark" />
    <script src="theme-init.js"></script>
    <!-- GitHub Pages SPA: restaurar ruta desde 404.html redirect -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded +
              l.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/x-icon" href="img/Responsables/logo.webp" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body class="mat-typography">
    <app-root></app-root>

    <noscript>Activa JavaScript para utilizar GROM 21.</noscript>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
      }
    </script>
  </body>
</html>
