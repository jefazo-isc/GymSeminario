<section class="feature-page stack" id="contenido-lector-servicios">
  <div class="service-grid">
    @for (service of services; track service.name) {
      <article class="service-card">
        <img
          [src]="service.image"
          [alt]="service.name"
          loading="lazy"
          width="600"
          height="360"
        />
        <div>
          <span class="eyebrow">{{ service.tag }}</span>
          <h2>{{ service.name }}</h2>
          <p>{{ service.text }}</p>
          <a class="text-link" routerLink="/f2"
            >Agendar entrenamiento<app-icon name="arrow"
          /></a>
        </div>
      </article>
    }
  </div>
  <div class="surface toolbar">
    <div>
      <h3>Encuentra una actividad para ti.</h3>
      <p class="muted">
        Consulta el catálogo informativo o pregunta por horarios y
        disponibilidad.
      </p>
    </div>
    <div class="form-actions">
      <a appButton="primary" routerLink="/buscar"
        >Explorar clases<app-icon name="search" /></a
      ><a appButton="secondary" routerLink="/ubicacion">Ubicación y contacto</a>
    </div>
  </div>
</section>
