<section class="feature-page stack">
  <div class="grid-3">
    @for (channel of channels; track channel.name) {
      <article class="surface social-channel">
        <span class="eyebrow">Canal oficial</span>
        <h2>{{ channel.name }}</h2>
        <p class="handle">{{ channel.handle }}</p>
        <p class="muted">{{ channel.description }}</p>
        <a
          class="ui-button ui-button--secondary"
          [href]="channel.url"
          target="_blank"
          rel="noopener noreferrer"
          >Visitar {{ channel.name }} ↗</a
        >
      </article>
    }
  </div>
  <p class="help">
    Los canales se abren en otra pestaña. El contenido actualizado y las
    interacciones se consultan directamente en cada plataforma.
  </p>
</section>
