<section class="feature-page stack">
  <div class="team-grid">
    @for (miembro of integrantes; track miembro.nombre) {
      <article class="surface team-member">
        <img
          decoding="async"
          [src]="miembro.foto"
          [alt]="miembro.nombre"
          width="120"
          height="120"
          loading="lazy"
        />
        <h2>{{ miembro.nombre }}</h2>
        <span class="muted">Equipo de desarrollo y diseño</span>
      </article>
    }
  </div>
  <div class="notice">
    <p>
      Proyecto académico de Tesis / Seminario · Ingeniería en Sistemas
      Computacionales · GROM Fitness Center · 2026.
    </p>
  </div>
</section>
