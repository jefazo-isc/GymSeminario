<div class="search-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar ejercicios</mat-label>
    <input
      matInput
      [(ngModel)]="searchTerm"
      (input)="onSearchChange()"
      placeholder="Busca por ejercicio o parte del cuerpo"
      class="search-input"
    />
    <app-icon matSuffix name="search" />
  </mat-form-field>
</div>
