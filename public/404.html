<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>espacioGYM</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Guardamos la URL completa en sessionStorage y redirigimos al index
      var segmentsToKeep = 1; // 1 = repo subdirectory (GymSeminario)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
