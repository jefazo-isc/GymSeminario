# ══════════════════════════════════════════════════════════════════════════════
#  espacioGYM — CI/CD Pipeline
#  GitHub Actions Workflow
#  Cubre: checkout · dependencias · pruebas unitarias · pruebas de integración
#          linting · análisis de vulnerabilidades · empaquetado Docker
# ══════════════════════════════════════════════════════════════════════════════

name: espacioGYM CI/CD Pipeline

# ── Disparadores ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# ── Permisos mínimos necesarios ───────────────────────────────────────────────
permissions:
  contents: write   # Para publicar en GitHub Pages y releases
  packages: write   # Para publicar imagen en GitHub Container Registry
  pages: write      # Para despliegue a GitHub Pages
  id-token: write

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 1 ── Construcción y Verificación de Código
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build-and-verify:
    name: 🏗️ Build & Verificación de Código
    runs-on: ubuntu-24.04

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Descarga de código fuente
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Historial completo para análisis de calidad

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Configuración del entorno y dependencias
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"     # Caché de dependencias para acelerar ejecuciones

      - name: 📦 Dependencias — Instalar paquetes del proyecto
        run: npm ci        # ci garantiza instalación limpia y reproducible

      - name: 🔨 Compilación — Construir la aplicación Angular (producción)
        run: |
          npm run build -- --configuration production --base-href /GymSeminario/
          cp dist/libreria1/browser/index.html dist/libreria1/browser/404.html

      - name: 📦 Artefacto — Guardar build de producción para despliegue
        uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: dist/libreria1/browser
          retention-days: 1

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 5 (15%): Análisis estático de código — ESLint / Angular Lint
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔍 Linting — Instalar ESLint y plugin Angular
        run: |
          npm install --save-dev \
            @angular-eslint/schematics \
            @angular-eslint/eslint-plugin \
            @angular-eslint/eslint-plugin-template \
            @angular-eslint/template-parser \
            @typescript-eslint/eslint-plugin \
            @typescript-eslint/parser \
            eslint@8.57.1 --legacy-peer-deps

      - name: 🔍 Linting — Crear configuración ESLint para Angular
        run: |
          cat > .eslintrc.json << 'ESLINT'
          {
            "root": true,
            "ignorePatterns": ["projects/**/*", "dist/**/*", "node_modules/**/*", "src/**/*.spec.ts"],
            "overrides": [
              {
                "files": ["*.ts"],
                "parser": "@typescript-eslint/parser",
                "parserOptions": {
                  "project": ["tsconfig.json"],
                  "createDefaultProgram": true
                },
                "plugins": ["@typescript-eslint", "@angular-eslint"],
                "rules": {
                  "@typescript-eslint/no-explicit-any": "warn",
                  "@typescript-eslint/no-unused-vars": "warn",
                  "no-console": "off",
                  "no-debugger": "error",
                  "@angular-eslint/component-class-suffix": "error",
                  "@angular-eslint/no-empty-lifecycle-method": "warn",
                  "@angular-eslint/use-lifecycle-interface": "warn"
                }
              },
              {
                "files": ["*.html"],
                "parser": "@angular-eslint/template-parser",
                "plugins": ["@angular-eslint/template"],
                "rules": {
                  "@angular-eslint/template/banana-in-box": "error",
                  "@angular-eslint/template/no-negated-async": "warn"
                }
              }
            ]
          }
          ESLINT

      - name: 🔍 Linting — Ejecutar análisis estático con ESLint
        run: npx eslint "src/**/*.ts" --max-warnings=50 --format stylish
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── Pruebas Unitarias
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Pruebas Unitarias (Karma + Jasmine)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno y dependencias
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 3 (15%): Pruebas unitarias con Karma en modo headless
      # ─────────────────────────────────────────────────────────────────────
      - name: 🧪 Pruebas Unitarias — Ejecutar con Chrome headless
        run: |
          npx ng test \
            --no-watch \
            --no-progress \
            --browsers=ChromeHeadless \
            --code-coverage \
            --karma-config=karma.conf.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: 📊 Cobertura — Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-pruebas-unitarias
          path: coverage/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 3 ── Pruebas de Integración (HTTP + Servicios)
  # ══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: 🔗 Pruebas de Integración (HttpClientTesting)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 4 (20%): Pruebas de integración
      # Filtra únicamente los spec de servicios que usan HttpClientTesting
      # (RutinaService, ApiService, QrService, UsuarioService, CursoService)
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔗 Integración — Crear configuración de karma para servicios
        run: |
          cat > karma.integration.conf.js << 'KARMA'
          module.exports = function(config) {
            config.set({
              basePath: '',
              frameworks: ['jasmine', '@angular-devkit/build-angular'],
              plugins: [
                require('karma-jasmine'),
                require('karma-chrome-launcher'),
                require('karma-jasmine-html-reporter'),
                require('karma-coverage'),
                require('@angular-devkit/build-angular/plugins/karma')
              ],
              files: [],
              preprocessors: {},
              reporters: ['progress', 'kjhtml', 'coverage'],
              coverageReporter: {
                dir: require('path').join(__dirname, './coverage-integration'),
                subdir: '.',
                reporters: [{ type: 'html' }, { type: 'text-summary' }]
              },
              port: 9876,
              colors: true,
              logLevel: config.LOG_INFO,
              autoWatch: false,
              browsers: ['ChromeHeadless'],
              singleRun: true,
              restartOnFileChange: false
            });
          };
          KARMA

      - name: 🔗 Integración — Ejecutar pruebas de servicios con HttpClientTesting
        run: |
          npx ng test \
            --configuration=integration \
            --no-watch \
            --no-progress \
            --browsers=ChromeHeadless \
            --code-coverage \
            --karma-config=karma.integration.conf.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: 📊 Artefacto — Subir reporte de integración
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-pruebas-integracion
          path: coverage-integration/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 4 ── Análisis de Vulnerabilidades
  # ══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: 🛡️ Análisis de Vulnerabilidades (npm audit)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 6 (15%): Análisis de vulnerabilidades con npm audit
      # ─────────────────────────────────────────────────────────────────────
      - name: 🛡️ Vulnerabilidades — Generar reporte npm audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate || true

      - name: 🛡️ Vulnerabilidades — Mostrar resumen del análisis
        run: |
          echo "========================================"
          echo "  RESUMEN DE ANÁLISIS DE SEGURIDAD"
          echo "========================================"
          npm audit --audit-level=high || true
          echo ""
          echo "Reporte completo guardado en: audit-report.json"

      - name: 🛡️ Vulnerabilidades — Análisis de secretos expuestos (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: 📊 Artefacto — Subir reporte de vulnerabilidades
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-vulnerabilidades
          path: audit-report.json
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 5 ── Empaquetado y Publicación Docker (GitHub Container Registry)
  # ══════════════════════════════════════════════════════════════════════════
  docker-publish:
    name: 🐳 Empaquetado Docker → GitHub Packages (GHCR)
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests, security-audit]
    # Solo publicar en push a main (no en PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout con historial para metadatos de imagen
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 7 (25%): Empaquetado — Build y push a GHCR
      # ─────────────────────────────────────────────────────────────────────
      - name: 🐳 Docker — Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v4

      - name: 🐳 Docker — Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Docker — Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Docker — Extraer metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: 🐳 Docker — Preparar nombre de repositorio en minúsculas (lowercase)
        id: repo_lower
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 🐳 Docker — Construir y publicar imagen Angular (Nginx)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 🐳 Docker — Publicar imagen del servidor Express
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-server:latest
            ghcr.io/${{ env.REPO_LOWER }}-server:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─────────────────────────────────────────────────────────────────────
      # DESPLIEGUE CONTINUO (CD): Publicar Frontend en GitHub Pages
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Artefacto — Descargar build de producción
        uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: dist/libreria1/browser

      - name: ⚙️ Pages — Configurar entorno GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 📦 Pages — Empaquetar artefacto para Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/libreria1/browser

      - name: 🚀 Pages — Desplegar oficialmente a GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🌐 GitHub Pages (Legacy) — Sincronizar rama gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/libreria1/browser
          cname: ''

      - name: ✅ Pipeline completado — Resumen
        run: |
          echo "=================================================="
          echo "  ✅ espacioGYM CI/CD Pipeline — COMPLETADO"
          echo "=================================================="
          echo "  🔨 Build Angular:       OK"
          echo "  🔍 Linting ESLint:      OK"
          echo "  🧪 Pruebas Unitarias:   OK"
          echo "  🔗 Pruebas Integración: OK"
          echo "  🛡️  Vulnerabilidades:    OK"
          echo "  🐳 Imagen Docker:       ghcr.io/${{ github.repository }}"
          echo "  📦 Tag:                 ${{ steps.meta.outputs.tags }}"
          echo "=================================================="
