# ══════════════════════════════════════════════════════════════════════════════
#  espacioGYM — CI/CD Pipeline
#  GitHub Actions Workflow
#  Cubre: checkout · dependencias · pruebas unitarias · pruebas de integración
#          linting · análisis de vulnerabilidades · empaquetado Docker
# ══════════════════════════════════════════════════════════════════════════════

name: espacioGYM CI/CD Pipeline

# ── Disparadores ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# ── Permisos mínimos necesarios ───────────────────────────────────────────────
permissions:
  contents: write   # Para publicar en GitHub Pages y releases
  packages: write   # Para publicar imagen en GitHub Container Registry
  pages: write      # Para despliegue a GitHub Pages
  id-token: write

# ══════════════════════════════════════════════════════════════════════════════
#  JOB 1 ── Construcción y Verificación de Código
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  build-and-verify:
    name: 🏗️ Build & Verificación de Código
    runs-on: ubuntu-24.04

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Descarga de código fuente
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente del repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Historial completo para análisis de calidad

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Configuración del entorno y dependencias
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"     # Caché de dependencias para acelerar ejecuciones

      - name: 📦 Dependencias — Instalar paquetes del proyecto
        run: npm ci        # ci garantiza instalación limpia y reproducible

      - name: 🔨 Compilación — Construir la aplicación Angular (producción)
        run: |
          npm run build -- --configuration production --base-href /GymSeminario/
          cp dist/libreria1/browser/index.html dist/libreria1/browser/404.html

      - name: 📦 Artefacto — Guardar build de producción para despliegue
        uses: actions/upload-artifact@v7
        with:
          name: angular-dist
          path: dist/libreria1/browser
          retention-days: 1

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 5 (15%): Análisis estático de código — ESLint v9 Flat Config
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔍 Linting — Instalar ESLint v9 y angular-eslint
        run: npm install --no-save eslint@^9.0.0 typescript-eslint@^8.0.0 angular-eslint@^19.0.0

      - name: 🔍 Linting — Crear configuración Flat Config (eslint.config.mjs)
        run: |
          cat > eslint.config.mjs << 'ESLINT'
          import tseslint from 'typescript-eslint';
          import angular from 'angular-eslint';

          export default [
            {
              ignores: ['projects/**/*', 'dist/**/*', 'node_modules/**/*', '.angular/**/*', 'src/**/*.spec.ts'],
            },
            {
              files: ['src/**/*.ts'],
              languageOptions: {
                parser: tseslint.parser,
              },
              plugins: {
                '@typescript-eslint': tseslint.plugin,
                '@angular-eslint': angular.tsPlugin,
              },
              rules: {
                '@typescript-eslint/no-explicit-any': 'error',
                '@typescript-eslint/no-unused-vars': ['error', { argsIgnorePattern: '^_', varsIgnorePattern: '^_' }],
                'no-console': 'off',
                'no-debugger': 'error',
                '@angular-eslint/component-class-suffix': 'error',
                '@angular-eslint/no-empty-lifecycle-method': 'error',
                '@angular-eslint/use-lifecycle-interface': 'error',
              },
            },
            {
              files: ['src/**/*.html'],
              languageOptions: {
                parser: angular.templateParser,
              },
              plugins: {
                '@angular-eslint/template': angular.templatePlugin,
              },
              rules: {
                '@angular-eslint/template/banana-in-box': 'error',
                '@angular-eslint/template/no-negated-async': 'error',
              },
            },
          ];
          ESLINT

      - name: 🔍 Linting — Ejecutar análisis estático con ESLint (cero advertencias)
        run: |
          npx eslint "src/**/*.ts" "src/**/*.html" --max-warnings=0 --format stylish
          rm -f eslint.config.mjs

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── Pruebas Unitarias
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Pruebas Unitarias (Karma + Jasmine)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno y dependencias
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 3 (15%): Pruebas unitarias con Karma en modo headless
      # ─────────────────────────────────────────────────────────────────────
      - name: 🧪 Pruebas Unitarias — Ejecutar con Chrome headless
        run: |
          npx ng test \
            --no-watch \
            --no-progress \
            --browsers=ChromeHeadless \
            --code-coverage \
            --karma-config=karma.conf.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: 📊 Cobertura — Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-pruebas-unitarias
          path: coverage/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 3 ── Pruebas de Integración (HTTP + Servicios)
  # ══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: 🔗 Pruebas de Integración (HttpClientTesting)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 4 (20%): Pruebas de integración
      # Filtra únicamente los spec de servicios que usan HttpClientTesting
      # (RutinaService, ApiService, QrService, UsuarioService, CursoService)
      # ─────────────────────────────────────────────────────────────────────
      - name: 🔗 Integración — Crear configuración de karma para servicios
        run: |
          cat > karma.integration.conf.js << 'KARMA'
          module.exports = function(config) {
            config.set({
              basePath: '',
              frameworks: ['jasmine', '@angular-devkit/build-angular'],
              plugins: [
                require('karma-jasmine'),
                require('karma-chrome-launcher'),
                require('karma-jasmine-html-reporter'),
                require('karma-coverage'),
                require('@angular-devkit/build-angular/plugins/karma')
              ],
              files: [],
              preprocessors: {},
              reporters: ['progress', 'kjhtml', 'coverage'],
              coverageReporter: {
                dir: require('path').join(__dirname, './coverage-integration'),
                subdir: '.',
                reporters: [{ type: 'html' }, { type: 'text-summary' }]
              },
              port: 9876,
              colors: true,
              logLevel: config.LOG_INFO,
              autoWatch: false,
              browsers: ['ChromeHeadless'],
              singleRun: true,
              restartOnFileChange: false
            });
          };
          KARMA

      - name: 🔗 Integración — Ejecutar pruebas de servicios con HttpClientTesting
        run: |
          npx ng test \
            --configuration=integration \
            --no-watch \
            --no-progress \
            --browsers=ChromeHeadless \
            --code-coverage \
            --karma-config=karma.integration.conf.js
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: 📊 Artefacto — Subir reporte de integración
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-pruebas-integracion
          path: coverage-integration/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 4 ── Análisis de Vulnerabilidades
  # ══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: 🛡️ Análisis de Vulnerabilidades (npm audit)
    runs-on: ubuntu-24.04
    needs: build-and-verify

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 1 (5%): Checkout
      # ─────────────────────────────────────────────────────────────────────
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 2 (5%): Entorno
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup — Configurar Node.js 22 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Dependencias — Instalar paquetes
        run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # CRITERIO 6 (15%): Análisis de vulnerabilidades con npm audit
      # ─────────────────────────────────────────────────────────────────────
      - name: 🛡️ Vulnerabilidades — Generar reporte npm audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=moderate || true

      - name: 🛡️ Vulnerabilidades — Mostrar resumen del análisis
        run: |
          echo "========================================"
          echo "  RESUMEN DE ANÁLISIS DE SEGURIDAD"
          echo "========================================"
          npm audit --audit-level=high || true
          echo ""
          echo "Reporte completo guardado en: audit-report.json"

      - name: 🛡️ Vulnerabilidades — Análisis de secretos expuestos (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: 📊 Artefacto — Subir reporte de vulnerabilidades
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reporte-vulnerabilidades
          path: audit-report.json
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 5A ── Empaquetado Docker Frontend (Prebuilt → GHCR, paralelo)
  # ══════════════════════════════════════════════════════════════════════════
  docker-frontend:
    name: 🐳 Docker Frontend → GHCR (Prebuilt)
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7

      - name: 📥 Artefacto — Descargar build de producción
        uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: dist/libreria1/browser

      - name: 🐳 Docker — Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Docker — Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Docker — Extraer metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: 🐳 Docker — Empaquetar y publicar imagen Angular (prebuilt)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 5B ── Empaquetado Docker Server (Node 22 Slim → GHCR, paralelo)
  # ══════════════════════════════════════════════════════════════════════════
  docker-server:
    name: 🐳 Docker Server → GHCR (Slim)
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout — Descargar código fuente
        uses: actions/checkout@v7

      - name: 🐳 Docker — Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🐳 Docker — Login en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Docker — Extraer metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: 🐳 Docker — Preparar nombre de repositorio en minúsculas (lowercase)
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 🐳 Docker — Publicar imagen del servidor Express
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-server:latest
            ghcr.io/${{ env.REPO_LOWER }}-server:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          platforms: linux/amd64

  # ══════════════════════════════════════════════════════════════════════════
  #  JOB 6 ── Despliegue Continuo → GitHub Pages (paralelo)
  # ══════════════════════════════════════════════════════════════════════════
  deploy-pages:
    name: 🌐 Despliegue → GitHub Pages
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Artefacto — Descargar build de producción
        uses: actions/download-artifact@v8
        with:
          name: angular-dist
          path: dist/libreria1/browser

      - name: ⚙️ Pages — Configurar entorno GitHub Pages
        uses: actions/configure-pages@v6

      - name: 📦 Pages — Empaquetar artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/libreria1/browser

      - name: 🚀 Pages — Desplegar oficialmente a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🌐 GitHub Pages (Legacy) — Sincronizar rama gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORK_DIR="$(mktemp -d)"
          cp -a dist/libreria1/browser/. "${WORK_DIR}/"
          touch "${WORK_DIR}/.nojekyll"
          git -C "${WORK_DIR}" init -b gh-pages
          git -C "${WORK_DIR}" config user.name "github-actions[bot]"
          git -C "${WORK_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${WORK_DIR}" add -A
          git -C "${WORK_DIR}" commit -m "deploy: ${GITHUB_SHA}"
          git -C "${WORK_DIR}" push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf "${WORK_DIR}"

      - name: ✅ Pipeline completado — Resumen
        run: |
          echo "=================================================="
          echo "  ✅ espacioGYM CI/CD Pipeline — COMPLETADO"
          echo "=================================================="
          echo "  🔨 Build Angular:       OK"
          echo "  🔍 Linting ESLint v9:   OK (0 warnings)"
          echo "  🧪 Pruebas Unitarias:   OK"
          echo "  🔗 Pruebas Integración: OK"
          echo "  🛡️  Vulnerabilidades:    OK"
          echo "  🌐 GitHub Pages:        ${{ steps.deployment.outputs.page_url }}"
          echo "=================================================="
