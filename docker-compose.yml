name: gym-seminario

services:
  # 1. Backend IA (Coach Virtual Gemini)
  backend-ia:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grom_backend_ia
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    networks:
      - grom-network

  # 2. Backend Notificaciones (Email y SMS)
  backend-notif:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: grom_backend_notif
    restart: always
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
    networks:
      - grom-network

  # 3. Frontend Angular
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grom_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend-ia
      - backend-notif
    networks:
      - grom-network

networks:
  grom-network:
    driver: bridge
